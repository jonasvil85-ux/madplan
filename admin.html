<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Måltidsjagten</title>
<style>
:root { --bg: #15100C; --surface: #1F1813; --surface-2: #2B211A; --border: #3A2D22; --text-1: #fff; --text-2: #D4D4D4; --text-3: #A0A0A0; --accent: #E8743B; --varsel: #F59E0B; }
* { box-sizing: border-box; }
body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text-2); line-height: 1.5; }
main { max-width: 960px; margin: 0 auto; padding: 24px 16px 80px; }
h1, h2 { color: var(--text-1); margin: 0; } h1 { font-size: 24px; } h2 { font-size: 17px; margin: 32px 0 12px; }
a { color: var(--accent); }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
button, .knap { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); padding: 7px 12px; border-radius: 10px; font: inherit; font-size: 13px; cursor: pointer; text-decoration: none; }
button:hover, .knap:hover { border-color: var(--accent); color: #fff; }
button.aktiv { background: var(--accent); color: #fff; border-color: var(--accent); }
.kort { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
.tal b { display: block; font-size: 28px; color: var(--text-1); line-height: 1.1; }
.tal span { font-size: 12px; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; }
.boks { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
.soejler { display: flex; align-items: flex-end; gap: 3px; height: 120px; }
.soejle { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .85; }
.soejle.nul { background: var(--border); }
.akse { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); margin-top: 6px; }
.filter { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.fb { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
.fb.klar { opacity: .55; }
.fb-hoved { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--text-3); margin-bottom: 6px; }
.tag { background: var(--surface-2); color: var(--text-2); padding: 2px 8px; border-radius: 6px; font-size: 12px; margin-right: 6px; }
.besked { color: var(--text-1); white-space: pre-wrap; word-wrap: break-word; margin: 4px 0 8px; }
.ctx { font-size: 12px; color: var(--text-3); }
.fb-bund { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.tom { color: var(--text-3); padding: 16px 0; }
.fejl { color: #f87171; } .ok { color: var(--accent); }
form#login { display: grid; gap: 10px; max-width: 340px; margin: 60px auto; }
form#login input { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: #fff; font: inherit; font-size: 16px; }
form#login .primaer { background: var(--accent); color: #fff; font-weight: 600; border: 0; padding: 12px; }
.skjult { display: none !important; }
</style>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" href="/favicon.ico?v=2" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
</head>
<body>
<main>
  <div class="top">
    <h1>Måltidsjagten · Admin</h1>
    <div id="bruger"></div>
  </div>

  <form id="login" class="skjult">
    <h2 style="margin:0">Log ind</h2>
    <input id="mail" type="email" placeholder="E-mail" autocomplete="email" required>
    <input id="pw" type="password" placeholder="Adgangskode" autocomplete="current-password" required>
    <button class="primaer" type="submit">Log ind</button>
    <p id="login-fejl" class="fejl"></p>
  </form>

  <div id="dash" class="skjult">
    <h2>Brugere</h2>
    <div class="kort" id="tal"></div>
    <div class="boks" style="margin-top:12px">
      <div style="color:var(--text-1);font-size:14px;margin-bottom:10px">Nye brugere pr. dag (seneste 30 dage)</div>
      <div class="soejler" id="soejler"></div>
      <div class="akse"><span id="akse-fra"></span><span id="akse-til"></span></div>
    </div>

    <h2>Besøg</h2>
    <div class="boks">Besøgstal (sidevisninger, unikke besøgende, kilder) ses i Vercel:
      <a href="https://vercel.com/dashboard" target="_blank" rel="noopener">Åbn Vercel → dit projekt → Analytics</a>.</div>

    <h2>Beskeder fra brugere</h2>
    <div class="filter">
      <button data-f="ny" class="aktiv">Ubehandlede</button>
      <button data-f="alle">Alle</button>
      <span id="fb-antal" style="align-self:center;color:var(--text-3);font-size:13px"></span>
    </div>
    <div id="feedback"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
const ADMIN = 'jonasvilladsen@live.dk';  // håndhæves i databasen (scripts/admin.sql) – dette er kun til visning
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let klient, rækker = [], filter = 'ny';

const dato = t => new Date(t).toLocaleString('da-DK', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

async function start() {
  klient = sb = window.supabase.createClient(AUTH.url, AUTH.anonKey);  // sb: delt med auth.js, som håndterer "Log ud"
  const { data } = await klient.auth.getSession();
  const u = data.session?.user;
  if (!u) return visLogin();
  if (u.email !== ADMIN) {
    $('bruger').innerHTML = `<span class="fejl">${esc(u.email)} har ikke adgang.</span> <button id="logud">Log ud</button>`;
    return;
  }
  $('login').classList.add('skjult');
  $('bruger').innerHTML = `${esc(u.email)} <button id="logud">Log ud</button>`;
  $('dash').classList.remove('skjult');
  hentStatistik(); hentFeedback();
}

function visLogin() { $('login').classList.remove('skjult'); }

$('login').addEventListener('submit', async e => {
  e.preventDefault();
  const { error } = await klient.auth.signInWithPassword({ email: $('mail').value.trim(), password: $('pw').value });
  if (error) $('login-fejl').textContent = 'Forkert e-mail eller adgangskode.'; else location.reload();
});
document.addEventListener('click', async e => {
  const f = e.target.dataset?.f;
  if (f) { filter = f; document.querySelectorAll('[data-f]').forEach(b => b.classList.toggle('aktiv', b.dataset.f === f)); tegnFeedback(); }
  const id = e.target.dataset?.klar;
  if (id) markér(Number(id), e.target.dataset.til === '1');
});

async function hentStatistik() {
  const { data, error } = await klient.rpc('admin_statistik');
  if (error) { $('tal').innerHTML = `<p class="fejl">Kunne ikke hente statistik: ${esc(error.message)}<br>Har du kørt scripts/admin.sql i Supabase?</p>`; return; }
  const kort = [['Brugere i alt', data.brugere_i_alt], ['Bekræftede', data.bekraeftede], ['Nye seneste 7 dage', data.nye_7_dage], ['Aktive seneste 7 dage', data.aktive_7_dage]];
  $('tal').innerHTML = kort.map(([t, n]) => `<div class="tal"><b>${esc(n)}</b><span>${esc(t)}</span></div>`).join('');
  const dage = data.pr_dag || [];
  const maks = Math.max(1, ...dage.map(d => d.antal));
  $('soejler').innerHTML = dage.map(d => `<div class="soejle ${d.antal ? '' : 'nul'}" style="height:${Math.max(2, d.antal / maks * 100)}%" title="${esc(d.dag)}: ${d.antal}"></div>`).join('');
  if (dage.length) { $('akse-fra').textContent = dage[0].dag; $('akse-til').textContent = dage[dage.length - 1].dag + ' · maks ' + maks + '/dag'; }
}

async function hentFeedback() {
  const { data, error } = await klient.from('feedback').select('*').order('oprettet', { ascending: false }).limit(500);
  if (error) { $('feedback').innerHTML = `<p class="fejl">Kunne ikke hente beskeder: ${esc(error.message)}<br>Har du kørt scripts/admin.sql i Supabase?</p>`; return; }
  rækker = data; tegnFeedback();
}

function tegnFeedback() {
  const vis = rækker.filter(r => filter === 'alle' || !r.behandlet);
  $('fb-antal').textContent = `${rækker.filter(r => !r.behandlet).length} ubehandlede af ${rækker.length}`;
  if (!vis.length) { $('feedback').innerHTML = '<div class="tom">Ingen beskeder her endnu.</div>'; return; }
  $('feedback').innerHTML = vis.map(r => {
    const k = r.kontekst || {};
    const ctx = [k.butik && 'Butik: ' + k.butik, k.trin && 'Trin: ' + k.trin, k.valgte_retter?.length && 'Valgte retter: ' + k.valgte_retter.join(', '), k.genereret && 'Data: ' + String(k.genereret).slice(0, 10), k.skaerm && 'Skærm: ' + k.skaerm].filter(Boolean).join(' · ');
    return `<div class="fb ${r.behandlet ? 'klar' : ''}">
      <div class="fb-hoved"><span><span class="tag">${esc(r.type)}</span>${esc(dato(r.oprettet))}</span><span>#${esc(r.id)}</span></div>
      <div class="besked">${esc(r.besked)}</div>
      ${ctx ? `<div class="ctx">${esc(ctx)}</div>` : ''}
      <div class="fb-bund"><span>${r.email ? `Svar til: <a href="mailto:${esc(r.email)}">${esc(r.email)}</a>` : '<span class="ctx">Ingen e-mail oplyst</span>'}</span>
        <button data-klar="${esc(r.id)}" data-til="${r.behandlet ? 0 : 1}">${r.behandlet ? 'Markér som ubehandlet' : '✓ Markér som behandlet'}</button></div>
    </div>`;
  }).join('');
}

async function markér(id, til) {
  const { error } = await klient.from('feedback').update({ behandlet: til }).eq('id', id);
  if (error) return alert('Kunne ikke gemme: ' + error.message);
  rækker.find(r => r.id === id).behandlet = til; tegnFeedback();
}

start();
</script>
</body>
</html>
