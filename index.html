<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Madplan — ugens retter ud fra tilbudsaviserne</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script defer src="/_vercel/insights/script.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0C1120;
  --surface: #111827;
  --surface-2: #1A2438;
  --border: rgba(148,163,184,0.14);
  --text-1: #FFFFFF;
  --text-2: #D4D4D4;
  --text-3: #A0A0A0;
  --emerald: #10B981;
  --emerald-dk: #059669;
  --amber: #F59E0B;
  --red: #EF4444;
  --netto: #F7C600;
  --meny: #E2001A;
  --radius: 14px;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text-2); line-height: 1.5; }
h1, h2, h3 { color: var(--text-1); margin: 0; }
button { font: inherit; cursor: pointer; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 120px; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
header.top h1 { font-size: 24px; font-weight: 700; }
header.top h1 span { color: var(--emerald); }
.aviser { font-size: 13px; color: var(--text-3); }

nav.trin { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
nav.trin button { background: var(--surface); border: 1px solid var(--border); color: var(--text-3); padding: 10px 16px; border-radius: 999px; font-weight: 500; }
nav.trin button.aktiv { background: var(--emerald); border-color: var(--emerald); color: #fff; }
nav.trin button:disabled { opacity: .4; cursor: not-allowed; }

.filtre { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.chip { background: var(--surface); border: 1px solid var(--border); color: var(--text-2); padding: 6px 12px; border-radius: 999px; font-size: 13px; }
.chip.aktiv { border-color: var(--emerald); color: var(--emerald); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.ret { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; cursor: pointer; transition: border-color .15s, transform .15s; position: relative; }
.ret:hover { transform: translateY(-2px); }
.ret.valgt { border-color: var(--emerald); box-shadow: 0 0 0 1px var(--emerald) inset; }
.ret.valgt::after { content: '✓'; position: absolute; top: 12px; right: 14px; background: var(--emerald); color: #fff; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 700; }
.ret h3 { font-size: 16px; margin-bottom: 4px; padding-right: 30px; }
.ret p { margin: 0 0 10px; font-size: 14px; color: var(--text-3); }
.meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; }
.tag { background: var(--surface-2); padding: 3px 8px; border-radius: 6px; color: var(--text-2); }
.tag.netto { color: var(--netto); }
.tag.meny { color: #FF5A6E; }
.tag.frisk { color: var(--amber); }
.tilbudsliste { margin-top: 10px; font-size: 12px; color: var(--text-3); }
.tilbudsliste b { color: var(--emerald); font-weight: 600; }

.bund { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(12,17,32,.95); backdrop-filter: blur(8px); border-top: 1px solid var(--border); padding: 14px 20px; }
.bund .wrap { padding: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.knap { background: var(--emerald); color: #fff; border: 0; padding: 12px 20px; border-radius: 10px; font-weight: 600; }
.knap:hover { background: var(--emerald-dk); }
.knap:disabled { opacity: .4; cursor: not-allowed; }
.knap.sekundaer { background: var(--surface-2); color: var(--text-1); }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
.panel h2 { font-size: 17px; margin-bottom: 12px; }
.valg { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.butikvalg { flex: 1; min-width: 200px; background: var(--surface-2); border: 2px solid transparent; border-radius: 12px; padding: 14px; text-align: left; color: var(--text-2); }
.butikvalg.aktiv { border-color: var(--emerald); }
.butikvalg strong { display: block; color: var(--text-1); font-size: 16px; }
.personer { display: flex; align-items: center; gap: 8px; }
.personer button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-1); }

.vare { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border); }
.vare:last-child { border-bottom: 0; }
.vare input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--emerald); flex-shrink: 0; }
.vare img { width: 52px; height: 52px; object-fit: contain; background: #fff; border-radius: 8px; flex-shrink: 0; }
.vare .tekst { flex: 1; }
.vare .navn { color: var(--text-1); font-weight: 500; }
.vare .detalje { font-size: 13px; color: var(--text-3); }
.vare .pris { font-weight: 700; color: var(--emerald); white-space: nowrap; }
.vare.taget .navn { text-decoration: line-through; opacity: .5; }

.dag { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
.dag summary { list-style: none; padding: 16px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.dag summary::-webkit-details-marker { display: none; }
.dag .dagnavn { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--emerald); font-weight: 600; }
.dag .retnavn { color: var(--text-1); font-weight: 600; font-size: 16px; }
.dag select { background: var(--surface-2); color: var(--text-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; max-width: 200px; }
.opskrift { padding: 0 18px 18px; display: grid; grid-template-columns: 1fr 2fr; gap: 24px; }
.opskrift ul, .opskrift ol { margin: 0; padding-left: 18px; }
.opskrift li { margin-bottom: 6px; }
.opskrift h3 { font-size: 14px; margin-bottom: 8px; }
@media (max-width: 700px) { .opskrift { grid-template-columns: 1fr; } }

.status { text-align: center; padding: 60px 20px; color: var(--text-3); }
.spinner { width: 36px; height: 36px; border: 3px solid var(--surface-2); border-top-color: var(--emerald); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.fejl { color: var(--red); }
.skjult { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Mad<span>plan</span></h1>
    <div class="aviser" id="aviser"></div>
  </header>

  <nav class="trin">
    <button data-trin="retter" class="aktiv">1. Vælg retter</button>
    <button data-trin="liste">2. Indkøbsliste</button>
    <button data-trin="plan">3. Ugeplan</button>
  </nav>

  <main id="indhold"><div class="status"><div class="spinner"></div>Henter ugens tilbudsaviser…</div></main>
</div>

<div class="bund skjult" id="bund"><div class="wrap" id="bundIndhold"></div></div>

<script>
const BUTIKKER = { netto: { navn: 'Netto', prefix: 'N' }, meny: { navn: 'MENY', prefix: 'M' } };
const KATEGORIER = { kylling: 'Kylling', okse: 'Okse', svin: 'Svin', fisk: 'Fisk', vegetar: 'Vegetar', andet: 'Andet' };
const DAGE = ['Søndag', 'Mandag', 'Tirsdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lørdag'];
const GEM = 'madplan-v1';

let data = null;   // svar fra /api/retter
let state = { noegle: null, trin: 'retter', filter: 'alle', valgte: [], butik: null, personer: 4, afkrydset: {}, handlet: false, plan: [] };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const kr = n => n == null ? '' : n.toLocaleString('da-DK', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }) + ' kr';
const gem = () => localStorage.setItem(GEM, JSON.stringify({ state, data }));
const ret = id => data.retter.find(r => r.id === id);
const faktor = () => state.personer / 4;

function maengde(m, enhed) {
  if (enhed === 'efter smag' || !m) return enhed === 'efter smag' ? 'efter smag' : '';
  if (enhed === 'g' && m >= 1000) return `${+(m / 1000).toFixed(2)} kg`;
  if (enhed === 'ml' && m >= 1000) return `${+(m / 1000).toFixed(2)} l`;
  const v = m >= 10 ? Math.round(m) : +m.toFixed(1);
  return `${v.toLocaleString('da-DK')} ${enhed}`;
}

// Tilbud der matcher en ingrediens i en given butik
const butiksTilbud = (ing, butik) => ing.tilbud.filter(id => id.startsWith(BUTIKKER[butik].prefix) && data.tilbud[id]);

// ---------- Indlæsning ----------
async function start() {
  const gemt = JSON.parse(localStorage.getItem(GEM) || 'null');
  try {
    const t = await fetch('/api/tilbud').then(r => r.ok ? r.json() : Promise.reject(r));
    if (gemt?.data?.noegle === t.noegle) {
      data = gemt.data; state = { ...state, ...gemt.state };
    } else {
      // Ny uge (eller første besøg) — hent nye retter. Plan fra sidste uge nulstilles.
      vis(`<div class="status"><div class="spinner"></div>Claude gennemgår ${t.tilbud.length} tilbud fra Netto og MENY og finder på retter…<br><small>Første gang i en ny uge kan det tage et par minutter.</small></div>`);
      const r = await fetch(`/api/retter?noegle=${encodeURIComponent(t.noegle)}`);
      const svar = await r.json();
      if (!r.ok) throw new Error(svar.error === 'CLAUDE_NOT_CONFIGURED' ? 'ANTHROPIC_API_KEY mangler i Vercel' : svar.error);
      data = svar;
      state.noegle = data.noegle;
      gem();
    }
    visAviser();
    render();
  } catch (e) {
    vis(`<div class="status fejl">Noget gik galt: ${esc(e.message || e.statusText || e)}</div>`);
  }
}

function visAviser() {
  const fmt = s => new Date(s.replace(/([+-]\d\d)(\d\d)$/, '$1:$2')).toLocaleDateString('da-DK', { day: 'numeric', month: 'short' });
  document.getElementById('aviser').innerHTML = Object.entries(data.butikker)
    .map(([k, b]) => b.aviser.map(a => `${esc(a.navn)} (${fmt(a.fra)}–${fmt(a.til)})`).join(', '))
    .join(' · ');
}

// ---------- Render ----------
const vis = html => { document.getElementById('indhold').innerHTML = html; };

function bund(html) {
  const el = document.getElementById('bund');
  el.classList.toggle('skjult', !html);
  document.getElementById('bundIndhold').innerHTML = html || '';
}

function render() {
  document.querySelectorAll('nav.trin button').forEach(b => {
    b.classList.toggle('aktiv', b.dataset.trin === state.trin);
    b.disabled = (b.dataset.trin === 'liste' && !state.valgte.length) || (b.dataset.trin === 'plan' && !state.handlet);
  });
  ({ retter: renderRetter, liste: renderListe, plan: renderPlan })[state.trin]();
  gem();
}

function renderRetter() {
  const kat = ['alle', ...new Set(data.retter.map(r => r.kategori))];
  const synlige = data.retter.filter(r => state.filter === 'alle' || r.kategori === state.filter);

  vis(`
    <div class="filtre">${kat.map(k => `<button class="chip ${state.filter === k ? 'aktiv' : ''}" data-filter="${k}">${k === 'alle' ? 'Alle' : KATEGORIER[k]}</button>`).join('')}</div>
    <div class="grid">${synlige.map(r => {
      const tilbudsvarer = r.ingredienser.filter(i => i.tilbud.length);
      const antal = b => r.ingredienser.filter(i => butiksTilbud(i, b).length).length;
      return `
        <div class="ret ${state.valgte.includes(r.id) ? 'valgt' : ''}" data-ret="${r.id}">
          <h3>${esc(r.navn)}</h3>
          <p>${esc(r.beskrivelse)}</p>
          <div class="meta">
            <span class="tag">${KATEGORIER[r.kategori]}</span>
            <span class="tag">${r.tid_minutter} min</span>
            ${antal('netto') ? `<span class="tag netto">Netto: ${antal('netto')} på tilbud</span>` : ''}
            ${antal('meny') ? `<span class="tag meny">MENY: ${antal('meny')} på tilbud</span>` : ''}
            ${r.spis_tidligt ? '<span class="tag frisk">Spis tidligt</span>' : ''}
          </div>
          ${tilbudsvarer.length ? `<div class="tilbudsliste"><b>På tilbud:</b> ${tilbudsvarer.map(i => esc(i.navn)).join(', ')}</div>` : ''}
        </div>`;
    }).join('')}</div>`);

  bund(`<span>${state.valgte.length} ${state.valgte.length === 1 ? 'ret' : 'retter'} valgt</span>
        <button class="knap" data-gaa="liste" ${state.valgte.length ? '' : 'disabled'}>Lav indkøbsliste →</button>`);
}

// Saml ingredienser fra valgte retter i én liste for valgt butik
function byggListe(butik) {
  const tilbud = new Map(), oevrige = new Map(), basis = new Map();
  for (const id of state.valgte) {
    const r = ret(id);
    for (const ing of r.ingredienser) {
      const m = ing.maengde * faktor();
      const match = butik ? butiksTilbud(ing, butik) : [];
      if (ing.basisvare) {
        basis.set(ing.navn.toLowerCase(), ing.navn);
      } else if (match.length) {
        const key = match[0];
        const v = tilbud.get(key) || { key, tilbud: data.tilbud[key], brug: [] };
        v.brug.push(`${maengde(m, ing.enhed)} ${ing.navn} (${r.navn})`.trim());
        tilbud.set(key, v);
      } else {
        const key = `${ing.navn.toLowerCase()}|${ing.enhed}`;
        const v = oevrige.get(key) || { key, navn: ing.navn, enhed: ing.enhed, m: 0, retter: [] };
        v.m += m; v.retter.push(r.navn);
        oevrige.set(key, v);
      }
    }
  }
  return { tilbud: [...tilbud.values()], oevrige: [...oevrige.values()], basis: [...basis.entries()] };
}

function renderListe() {
  const antal = b => byggListe(b).tilbud.length;
  const sum = b => byggListe(b).tilbud.reduce((s, v) => s + (v.tilbud.pris || 0), 0);

  let html = `
    <div class="panel">
      <h2>Hvor vil du handle?</h2>
      <div class="valg">
        ${Object.entries(BUTIKKER).map(([k, b]) => `
          <button class="butikvalg ${state.butik === k ? 'aktiv' : ''}" data-butik="${k}">
            <strong>${b.navn}</strong>${antal(k)} varer på tilbud · ${kr(sum(k))}
          </button>`).join('')}
        <div class="personer">
          <button data-personer="-1">−</button><span><b>${state.personer}</b> personer</span><button data-personer="1">+</button>
        </div>
      </div>
    </div>`;

  if (state.butik) {
    const l = byggListe(state.butik);
    const linje = (key, navn, detalje, pris, billede) => `
      <label class="vare ${state.afkrydset[key] ? 'taget' : ''}">
        <input type="checkbox" data-kryds="${esc(key)}" ${state.afkrydset[key] ? 'checked' : ''}>
        ${billede ? `<img src="${esc(billede)}" alt="" loading="lazy">` : ''}
        <div class="tekst"><div class="navn">${esc(navn)}</div><div class="detalje">${detalje}</div></div>
        ${pris ? `<div class="pris">${pris}</div>` : ''}
      </label>`;

    html += `<div class="panel"><h2>På tilbud i ${BUTIKKER[state.butik].navn}</h2>${
      l.tilbud.length ? l.tilbud.map(v => linje(v.key, v.tilbud.navn,
        `${v.tilbud.maengde ? esc(v.tilbud.maengde + ' ' + (v.tilbud.enhed || '')) + ' · ' : ''}Til: ${v.brug.map(esc).join('; ')}`,
        kr(v.tilbud.pris), v.tilbud.billede)).join('')
      : '<p>Ingen af de valgte retter har tilbudsvarer i denne butik.</p>'}</div>`;

    if (l.oevrige.length) html += `<div class="panel"><h2>Øvrige varer</h2>${
      l.oevrige.map(v => linje(v.key, `${maengde(v.m, v.enhed)} ${v.navn}`.trim(), esc([...new Set(v.retter)].join(', ')))).join('')}</div>`;

    if (l.basis.length) html += `<div class="panel"><h2>Tjek om du har</h2>${
      l.basis.map(([k, navn]) => linje('basis|' + k, navn, '')).join('')}</div>`;
  }
  vis(html);

  bund(state.butik ? `<button class="knap sekundaer" data-kopier>Kopiér liste</button>
       <button class="knap" data-handlet>Jeg har handlet → ugeplan</button>` : '');
}

function lavPlan() {
  // Retter med frisk fisk o.l. først, resten i valgt rækkefølge
  const orden = [...state.valgte].sort((a, b) => ret(b).spis_tidligt - ret(a).spis_tidligt);
  const idag = new Date();
  state.plan = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(idag); d.setDate(idag.getDate() + i);
    return { dato: d.toISOString().slice(0, 10), ret: orden[i] || null };
  });
}

function renderPlan() {
  vis(state.plan.map((dag, i) => {
    const d = new Date(dag.dato);
    const r = dag.ret && ret(dag.ret);
    const valg = `<select data-dag="${i}">
        <option value="">— Ingen ret —</option>
        ${state.valgte.map(id => `<option value="${id}" ${id === dag.ret ? 'selected' : ''}>${esc(ret(id).navn)}</option>`).join('')}
      </select>`;
    return `
      <details class="dag" ${i === 0 ? 'open' : ''}>
        <summary>
          <div><div class="dagnavn">${DAGE[d.getDay()]} ${d.getDate()}/${d.getMonth() + 1}</div>
               <div class="retnavn">${r ? esc(r.navn) : 'Fri / rester'}</div></div>
          ${valg}
        </summary>
        ${r ? `<div class="opskrift">
          <div><h3>Ingredienser (${state.personer} pers.)</h3><ul>${r.ingredienser.map(ing =>
            `<li>${esc(`${maengde(ing.maengde * faktor(), ing.enhed)} ${ing.navn}`.trim())}</li>`).join('')}</ul></div>
          <div><h3>Fremgangsmåde · ${r.tid_minutter} min</h3><ol>${r.fremgangsmaade.map(t => `<li>${esc(t)}</li>`).join('')}</ol></div>
        </div>` : ''}
      </details>`;
  }).join(''));
  bund(`<button class="knap sekundaer" data-forfra>Start forfra</button><span></span>`);
}

function kopierListe() {
  const l = byggListe(state.butik);
  const tekst = [
    `Indkøbsliste — ${BUTIKKER[state.butik].navn}`, '',
    ...l.tilbud.map(v => `☐ ${v.tilbud.navn} (${kr(v.tilbud.pris)})`),
    ...l.oevrige.map(v => `☐ ${maengde(v.m, v.enhed)} ${v.navn}`.replace('  ', ' ')),
    ...(l.basis.length ? ['', 'Tjek om du har:', ...l.basis.map(([, n]) => `☐ ${n}`)] : []),
  ].join('\n');
  navigator.clipboard.writeText(tekst).then(() => alert('Listen er kopieret'));
}

// ---------- Hændelser ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-trin],[data-filter],[data-ret],[data-gaa],[data-butik],[data-personer],[data-handlet],[data-kopier],[data-forfra]');
  if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.trin) state.trin = d.trin;
  else if (d.filter) state.filter = d.filter;
  else if (d.ret) state.valgte = state.valgte.includes(d.ret) ? state.valgte.filter(x => x !== d.ret) : [...state.valgte, d.ret];
  else if (d.gaa) state.trin = d.gaa;
  else if (d.butik) state.butik = d.butik;
  else if (d.personer) state.personer = Math.max(1, Math.min(12, state.personer + +d.personer));
  else if ('handlet' in d) { state.handlet = true; lavPlan(); state.trin = 'plan'; }
  else if ('kopier' in d) return kopierListe();
  else if ('forfra' in d) { if (!confirm('Nulstil valg, indkøbsliste og ugeplan?')) return;
    state = { ...state, trin: 'retter', valgte: [], butik: null, afkrydset: {}, handlet: false, plan: [] }; }
  render();
  if (d.trin || d.gaa || 'handlet' in d) window.scrollTo(0, 0);
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.kryds) { state.afkrydset[t.dataset.kryds] = t.checked; t.closest('.vare').classList.toggle('taget', t.checked); gem(); }
  if (t.dataset.dag) { state.plan[+t.dataset.dag].ret = t.value || null; render(); }
});

start();
</script>
</body>
</html>
