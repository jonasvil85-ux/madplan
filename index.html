<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Madplan — ugens retter ud fra tilbudsaviserne</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script defer src="/_vercel/insights/script.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0C1120;
  --surface: #111827;
  --surface-2: #1A2438;
  --border: rgba(148,163,184,0.14);
  --text-1: #FFFFFF;
  --text-2: #D4D4D4;
  --text-3: #A0A0A0;
  --emerald: #10B981;
  --emerald-dk: #059669;
  --amber: #F59E0B;
  --red: #EF4444;
  --netto: #F7C600;
  --meny: #E2001A;
  --radius: 14px;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text-2); line-height: 1.5; }
h1, h2, h3 { color: var(--text-1); margin: 0; }
button { font: inherit; cursor: pointer; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 120px; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
header.top h1 { font-size: 24px; font-weight: 700; }
header.top h1 span { color: var(--emerald); }
.aviser { font-size: 13px; color: var(--text-3); }

nav.trin { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
nav.trin button { background: var(--surface); border: 1px solid var(--border); color: var(--text-3); padding: 10px 16px; border-radius: 999px; font-weight: 500; }
nav.trin button.aktiv { background: var(--emerald); border-color: var(--emerald); color: #fff; }
nav.trin button:disabled { opacity: .4; cursor: not-allowed; }

.filtre { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.chip { background: var(--surface); border: 1px solid var(--border); color: var(--text-2); padding: 6px 12px; border-radius: 999px; font-size: 13px; }
.chip.aktiv { border-color: var(--emerald); color: var(--emerald); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.ret { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; cursor: pointer; transition: border-color .15s, transform .15s; position: relative; }
.ret:hover { transform: translateY(-2px); }
.ret.valgt { border-color: var(--emerald); box-shadow: 0 0 0 1px var(--emerald) inset; }
.ret.valgt::after { content: '✓'; position: absolute; top: 12px; right: 14px; background: var(--emerald); color: #fff; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 700; }
.ret h3 { font-size: 16px; margin-bottom: 4px; padding-right: 30px; }
.ret p { margin: 0 0 10px; font-size: 14px; color: var(--text-3); }
.meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; }
.tag { background: var(--surface-2); padding: 3px 8px; border-radius: 6px; color: var(--text-2); }
.tag.netto { color: var(--netto); }
.tag.meny { color: #FF5A6E; }
.tag.frisk { color: var(--amber); }
.tag.pris { color: var(--emerald); font-weight: 600; }

.butikvalg { position: relative; }
.butikker { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; padding-top: 8px; }
.butikker .butikvalg { min-width: 0; }
.periode { display: block; color: var(--text-3); font-size: 13px; }
.butikker .butikvalg { box-shadow: inset 0 4px 0 var(--brand); padding-top: 18px; }
.butikker .butikvalg:hover { border-color: var(--brand); }
.butikker .butikvalg.vinder { border-color: var(--emerald); }
.butikhoved { display: flex; align-items: center; gap: 12px; }
.butikhoved strong { font-size: 16px; }
.logo { flex-shrink: 0; width: 76px; height: 44px; background: #fff; border-radius: 10px; padding: 6px 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
.logo.tekst { color: #111; font-weight: 700; font-size: 12px; }
.butikhoved.lille .logo { width: 52px; height: 30px; padding: 4px 6px; border-radius: 7px; }
.prisrække > * { white-space: nowrap; }
.prisoverskrift { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); margin-bottom: 4px; }
.butikvalg.vinder { border-color: var(--emerald); }
.billigst { position: absolute; top: -11px; right: 14px; background: var(--emerald); color: #fff; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
.prisrækker { display: block; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
.prisrække { display: grid; grid-template-columns: 1fr auto 52px; gap: 8px; align-items: baseline; padding: 3px 0; font-size: 14px; }
.prisrække b { color: var(--text-1); }
.prisrække small { color: var(--text-3); text-align: right; }
.prisrække.bedst b, .prisrække.bedst small { color: var(--emerald); }
.fodnote { font-size: 12px; color: var(--text-3); margin: 14px 0 0; }

.niveauer { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 14px; }
.niveau { background: var(--surface); border: 2px solid var(--border); border-radius: 12px; padding: 12px 14px; text-align: left; color: var(--text-3); display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: center; }
.niveau .ikon { grid-row: span 2; font-size: 26px; }
.niveau strong { color: var(--text-1); font-size: 15px; }
.niveau small { font-size: 12px; }
.niveau.aktiv { border-color: var(--emerald); background: var(--surface-2); }
.tilbudsliste { margin-top: 10px; font-size: 12px; color: var(--text-3); }
.tilbudsliste b { color: var(--emerald); font-weight: 600; }

.bund { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(12,17,32,.95); backdrop-filter: blur(8px); border-top: 1px solid var(--border); padding: 14px 20px; }
.bund .wrap { padding: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.knap { background: var(--emerald); color: #fff; border: 0; padding: 12px 20px; border-radius: 10px; font-weight: 600; }
.knap:hover { background: var(--emerald-dk); }
.knap:disabled { opacity: .4; cursor: not-allowed; }
.knap.sekundaer { background: var(--surface-2); color: var(--text-1); }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
.panel h2 { font-size: 17px; margin-bottom: 12px; }
.valg { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.butikvalg { flex: 1; min-width: 200px; background: var(--surface-2); border: 2px solid transparent; border-radius: 12px; padding: 14px; text-align: left; color: var(--text-2); }
.butikvalg.aktiv { border-color: var(--emerald); }
.butikvalg strong { display: block; color: var(--text-1); font-size: 16px; }
.personer { display: flex; align-items: center; gap: 8px; }
.personer button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-1); }

.vare { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border); }
.vare:last-child { border-bottom: 0; }
.vare input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--emerald); flex-shrink: 0; }
.vare img { width: 52px; height: 52px; object-fit: contain; background: #fff; border-radius: 8px; flex-shrink: 0; }
.vare .tekst { flex: 1; }
.vare .navn { color: var(--text-1); font-weight: 500; }
.vare .detalje { font-size: 13px; color: var(--text-3); }
.vare .pris { font-weight: 700; color: var(--emerald); white-space: nowrap; }
.vare.taget .navn { text-decoration: line-through; opacity: .5; }

.dag { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
.dag summary { list-style: none; padding: 16px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.dag summary::-webkit-details-marker { display: none; }
.dag .dagnavn { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--emerald); font-weight: 600; }
.dag .retnavn { color: var(--text-1); font-weight: 600; font-size: 16px; }
.dag select { background: var(--surface-2); color: var(--text-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; max-width: 200px; }
.opskrift { padding: 0 18px 18px; display: grid; grid-template-columns: 1fr 2fr; gap: 24px; }
.opskrift ul, .opskrift ol { margin: 0; padding-left: 18px; }
.opskrift li { margin-bottom: 6px; }
.opskrift h3 { font-size: 14px; margin-bottom: 8px; }
@media (max-width: 700px) { .opskrift { grid-template-columns: 1fr; } }

.status { text-align: center; padding: 60px 20px; color: var(--text-3); }
.spinner { width: 36px; height: 36px; border: 3px solid var(--surface-2); border-top-color: var(--emerald); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.fejl { color: var(--red); }
.skjult { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Mad<span>plan</span></h1>
    <div class="aviser" id="aviser"></div>
  </header>

  <nav class="trin">
    <button data-trin="retter" class="aktiv">1. Butik og retter</button>
    <button data-trin="liste">2. Indkøbsliste</button>
    <button data-trin="plan">3. Ugeplan</button>
  </nav>

  <main id="indhold"><div class="status"><div class="spinner"></div>Henter ugens tilbudsaviser…</div></main>
</div>

<div class="bund skjult" id="bund"><div class="wrap" id="bundIndhold"></div></div>

<script>
const KATEGORIER = { kylling: 'Kylling', okse: 'Okse', svin: 'Svin', fisk: 'Fisk', and: 'And', vegetar: 'Vegetar', andet: 'Andet' };
const NIVEAUER = {
  student: { ikon: '🎓', navn: 'Studentermad', kort: 'Student', tekst: 'Billigt, hurtigt og mættende' },
  familie: { ikon: '👨‍👩‍👧', navn: 'Familiemad', kort: 'Familie', tekst: 'Hverdagsmad hele familien kan lide' },
  weekend: { ikon: '🍷', navn: 'Weekendmad', kort: 'Weekend', tekst: 'Når der skal hygges lidt ekstra' },
};
const DAGE = ['Søndag', 'Mandag', 'Tirsdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lørdag'];
const GEM = 'madplan-v2';
const TOM = { trin: 'retter', niveau: 'alle', filter: 'alle', valgte: [], butik: null, personer: 4, afkrydset: {}, handlet: false, plan: [] };

let data = null;   // retter.json (bygges ugentligt af scripts/byg_retter.py)
let state = { ...TOM };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const kr = n => n == null ? '' : n.toLocaleString('da-DK', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }) + ' kr';
const gem = () => localStorage.setItem(GEM, JSON.stringify({ genereret: data.genereret, state }));
const B = () => data.butikker[state.butik];
const ret = id => B().retter.find(r => r.id === id);
const faktor = () => state.personer / 4;
const dato = s => new Date(s.replace(/([+-]\d\d)(\d\d)$/, '$1:$2'));
const kortDato = s => dato(s).toLocaleDateString('da-DK', { day: 'numeric', month: 'short' });

const tal = v => (+v.toFixed(2)).toLocaleString('da-DK');

function maengde(m, enhed) {
  if (enhed === 'efter smag' || !m) return '';
  if (enhed === 'g' && m >= 1000) return `${tal(m / 1000)} kg`;
  if (enhed === 'ml' && m >= 1000) return `${tal(m / 1000)} l`;
  return `${tal(m >= 10 ? Math.round(m) : m)} ${enhed}`;
}

// "500 g hakket oksekød" / "salt og peber (efter smag)"
const ingTekst = (ing, m) => ing.enhed === 'efter smag' ? `${ing.navn} (efter smag)` : `${maengde(m, ing.enhed)} ${ing.navn}`.trim();

// Hvor mange pakker af et tilbud skal der købes til det samlede forbrug?
const OMREGN = { g: ['g', 1], kg: ['g', 1000], ml: ['ml', 1], cl: ['ml', 10], l: ['ml', 1000], stk: ['stk', 1] };
function antalPakker(t, behov) {
  // Interval (fx "100-400 g") -> brug midten
  const dele = String(t.maengde || '').split('-').map(parseFloat);
  const str = dele.reduce((a, b) => a + b, 0) / dele.length;
  const [enhed, gange] = OMREGN[t.enhed] || [];
  let n = Math.ceil((behov.dåse || 0) + (behov.pakke || 0));
  if (str && enhed && behov[enhed]) n = Math.max(n, Math.ceil(behov[enhed] / (str * gange) - 1e-9));
  return Math.max(1, n);
}

// Tilbud der matcher en ingrediens i den valgte butik
const butiksTilbud = ing => ing.tilbud.filter(id => B().tilbud[id]);
const udloebet = b => b.aviser.every(a => dato(a.til) < new Date());

// ---------- Indlæsning ----------
async function start() {
  try {
    const r = await fetch('/retter.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error(`retter.json HTTP ${r.status}`);
    data = await r.json();
    // Nye ugeretter -> start forfra; ellers fortsæt hvor brugeren slap
    const gemt = JSON.parse(localStorage.getItem(GEM) || 'null');
    if (gemt?.genereret === data.genereret) state = { ...TOM, ...gemt.state };
    render();
  } catch (e) {
    vis(`<div class="status fejl">Noget gik galt: ${esc(e.message || e)}</div>`);
  }
}

function visAviser() {
  document.getElementById('aviser').innerHTML = state.butik
    ? B().aviser.map(a => `${esc(a.navn)} · ${kortDato(a.fra)}–${kortDato(a.til)}`).join(', ')
    : '';
}

// ---------- Render ----------
const vis = html => { document.getElementById('indhold').innerHTML = html; };

function bund(html) {
  const el = document.getElementById('bund');
  el.classList.toggle('skjult', !html);
  document.getElementById('bundIndhold').innerHTML = html || '';
}

function render() {
  document.querySelectorAll('nav.trin button').forEach(b => {
    b.classList.toggle('aktiv', b.dataset.trin === state.trin);
    b.disabled = (b.dataset.trin === 'liste' && !state.valgte.length) || (b.dataset.trin === 'plan' && !state.handlet);
  });
  visAviser();
  ({ retter: state.butik ? renderRetter : renderButikker, liste: renderListe, plan: renderPlan })[state.trin]();
  gem();
}

// Median-pris pr. person for tilbudsvarerne i en butiks retter på et prisniveau
function median(tal) {
  const s = [...tal].sort((a, b) => a - b), m = s.length >> 1;
  return s.length ? (s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2) : null;
}
// Samlet pris: tilbudsvarer (hele pakker) + skøn for varer til normalpris
const prisIAlt = r => r.pris_i_alt ?? r.pris_tilbud;
const prisPrPers = (b, niveau) => median(b.retter.filter(r => r.niveau === niveau).map(r => prisIAlt(r) / 4));

// Kædens logo i en hvid "chip", så alle logoer står pænt på den mørke baggrund
const logo = b => b.logo
  ? `<span class="logo"><img src="${esc(b.logo)}" alt="${esc(b.navn)}" loading="lazy"></span>`
  : `<span class="logo tekst">${esc(b.navn)}</span>`;

function renderButikker() {
  // Sammenlign kun butikker med gyldig avis
  const aktive = Object.keys(data.butikker).filter(k => !udloebet(data.butikker[k]));
  const priser = Object.fromEntries(Object.keys(data.butikker).map(k =>
    [k, Object.fromEntries(Object.keys(NIVEAUER).map(n => [n, prisPrPers(data.butikker[k], n)]))]));
  const billigstPaa = n => Math.min(...aktive.map(k => priser[k][n] ?? Infinity));
  const samlet = k => Object.values(priser[k]).reduce((s, p) => s + (p ?? 0), 0);
  const vinder = aktive.length > 1 ? aktive.reduce((a, k) => samlet(k) < samlet(a) ? k : a) : null;
  // Billigste først; butikker med udløbet avis til sidst
  const orden = Object.keys(data.butikker).sort((a, b) =>
    (aktive.includes(b) - aktive.includes(a)) || samlet(a) - samlet(b));

  vis(`<div class="panel"><h2>Hvilken tilbudsavis vil du handle efter?</h2><div class="butikker">
    ${orden.map(k => [k, data.butikker[k]]).map(([k, b]) => `
      <button class="butikvalg ${k === vinder ? 'vinder' : ''}" data-butik="${k}" style="--brand:${esc(b.farve || '#10B981')}">
        ${k === vinder ? '<span class="billigst">💰 Billigst denne uge</span>' : ''}
        <span class="butikhoved">
          ${logo(b)}
          <span><strong>${esc(b.navn)}</strong>
        <small class="periode">${b.aviser.map(a => `${kortDato(a.fra)}–${kortDato(a.til)}`).join(', ')} · ${b.retter.length} retter</small>
          </span>
        </span>
        ${udloebet(b) ? ' · <span class="fejl">avisen er udløbet – nye retter på vej</span>' : ''}
        <span class="prisrækker"><small class="prisoverskrift">Pris pr. person</small>${Object.entries(NIVEAUER).map(([n, niv]) => {
          const p = priser[k][n];
          if (p == null) return '';
          const bedst = aktive.includes(k) && p <= billigstPaa(n) + 0.5;  // under 50 øre = uafgjort
          const forskel = Math.round(p - billigstPaa(n));
          return `<span class="prisrække ${bedst ? 'bedst' : ''}">
            <span>${niv.ikon} ${niv.kort}</span>
            <b>${kr(Math.round(p))}</b>
            <small>${bedst ? 'billigst' : forskel > 0 ? `+${kr(forskel)}` : ''}</small>
          </span>`;
        }).join('')}</span>
      </button>`).join('')}
  </div>
  <p class="fodnote">Pris pr. person = median for butikkens retter på hvert niveau (4 personer). Tilbudsvarer regnes i hele pakker; varer til normalpris er et groft skøn. Basisvarer som salt, olie og mel er ikke med.</p>
  </div>`);
  bund('');
}

function renderRetter() {
  const retter = B().retter;
  const orden = Object.keys(NIVEAUER);
  const iNiveau = retter
    .filter(r => state.niveau === 'alle' || r.niveau === state.niveau)
    .sort((a, b) => orden.indexOf(a.niveau) - orden.indexOf(b.niveau) || prisIAlt(a) - prisIAlt(b));
  const kat = ['alle', ...Object.keys(KATEGORIER).filter(k => iNiveau.some(r => r.kategori === k))];
  if (!kat.includes(state.filter)) state.filter = 'alle';
  const synlige = iNiveau.filter(r => state.filter === 'alle' || r.kategori === state.filter);
  const antal = n => retter.filter(r => n === 'alle' || r.niveau === n).length;

  vis(`
    <div class="filtre" style="justify-content:space-between">
      <span class="butikhoved lille">${logo(B())}<span><b style="color:var(--text-1)">${esc(B().navn)}</b> · ${retter.length} retter ud fra ugens tilbud</span></span>
      <button class="chip" data-skift>Skift butik</button>
    </div>
    ${udloebet(B()) ? '<div class="panel fejl">Denne avis er udløbet – priserne gælder måske ikke længere. Nye retter kommer snart.</div>' : ''}
    <div class="niveauer">
      <button class="niveau ${state.niveau === 'alle' ? 'aktiv' : ''}" data-niveau="alle"><span class="ikon">🍽️</span><strong>Alle retter</strong><small>${antal('alle')} retter</small></button>
      ${Object.entries(NIVEAUER).map(([k, n]) => `
        <button class="niveau ${state.niveau === k ? 'aktiv' : ''}" data-niveau="${k}">
          <span class="ikon">${n.ikon}</span><strong>${n.navn}</strong><small>${n.tekst} · ${antal(k)} retter</small>
        </button>`).join('')}
    </div>
    <div class="filtre">${kat.map(k => `<button class="chip ${state.filter === k ? 'aktiv' : ''}" data-filter="${k}">${k === 'alle' ? 'Alle typer' : KATEGORIER[k]}</button>`).join('')}</div>
    <div class="grid">${synlige.map(r => {
      const tilbudsvarer = r.ingredienser.filter(i => butiksTilbud(i).length);
      return `
        <div class="ret ${state.valgte.includes(r.id) ? 'valgt' : ''}" data-ret="${r.id}">
          <h3>${esc(r.navn)}</h3>
          <p>${esc(r.beskrivelse)}</p>
          <div class="meta">
            <span class="tag">${NIVEAUER[r.niveau].ikon} ${NIVEAUER[r.niveau].navn}</span>
            <span class="tag">${KATEGORIER[r.kategori]}</span>
            <span class="tag">${r.tid_minutter} min</span>
            <span class="tag pris" title="Tilbudsvarer ${kr(Math.round(r.pris_tilbud))} (hele pakker) + skøn for øvrige varer · 4 personer">ca. ${kr(Math.round(prisIAlt(r)))} · ${kr(Math.round(prisIAlt(r) / 4))}/pers.</span>
            <span class="tag ${state.butik}">${tilbudsvarer.length} varer på tilbud</span>
            ${r.spis_tidligt ? '<span class="tag frisk">Spis tidligt</span>' : ''}
          </div>
          ${tilbudsvarer.length ? `<div class="tilbudsliste"><b>På tilbud:</b> ${tilbudsvarer.map(i => esc(i.navn)).join(', ')}</div>` : ''}
        </div>`;
    }).join('')}</div>`);

  bund(`<span>${state.valgte.length} ${state.valgte.length === 1 ? 'ret' : 'retter'} valgt</span>
        <button class="knap" data-gaa="liste" ${state.valgte.length ? '' : 'disabled'}>Lav indkøbsliste →</button>`);
}

// Saml ingredienser fra valgte retter i én liste for den valgte butik
function byggListe() {
  const tilbud = new Map(), oevrige = new Map(), basis = new Map();
  for (const id of state.valgte) {
    const r = ret(id);
    for (const ing of r.ingredienser) {
      const m = ing.maengde * faktor();
      const match = butiksTilbud(ing);
      if (ing.basisvare) {
        basis.set(ing.navn.toLowerCase(), ing.navn);
      } else if (match.length) {
        const key = match[0];
        const v = tilbud.get(key) || { key, tilbud: B().tilbud[key], brug: [], behov: {} };
        v.brug.push(`${ingTekst(ing, m)} (${r.navn})`);
        v.behov[ing.enhed] = (v.behov[ing.enhed] || 0) + m;
        tilbud.set(key, v);
      } else {
        const key = `${ing.navn.toLowerCase()}|${ing.enhed}`;
        const v = oevrige.get(key) || { key, navn: ing.navn, enhed: ing.enhed, m: 0, retter: [] };
        v.m += m; v.retter.push(r.navn);
        oevrige.set(key, v);
      }
    }
  }
  for (const v of tilbud.values()) {
    v.antal = antalPakker(v.tilbud, v.behov);
    v.pris = (v.tilbud.pris || 0) * v.antal;
  }
  return { tilbud: [...tilbud.values()], oevrige: [...oevrige.values()], basis: [...basis.entries()] };
}

const tilbudsNavn = v => `${v.antal > 1 ? v.antal + ' × ' : ''}${v.tilbud.navn}`;

function renderListe() {
  const l = byggListe();
  const sum = l.tilbud.reduce((s, v) => s + v.pris, 0);

  let html = `
    <div class="panel">
      <div class="valg" style="justify-content:space-between">
        <span>Indkøbsliste til <b style="color:var(--text-1)">${esc(B().navn)}</b> · ${l.tilbud.length} tilbudsvarer for i alt ${kr(sum)}</span>
        <div class="personer">
          <button data-personer="-1">−</button><span><b>${state.personer}</b> personer</span><button data-personer="1">+</button>
        </div>
      </div>
    </div>`;

  {
    const linje = (key, navn, detalje, pris, billede) => `
      <label class="vare ${state.afkrydset[key] ? 'taget' : ''}">
        <input type="checkbox" data-kryds="${esc(key)}" ${state.afkrydset[key] ? 'checked' : ''}>
        ${billede ? `<img src="${esc(billede)}" alt="" loading="lazy">` : ''}
        <div class="tekst"><div class="navn">${esc(navn)}</div><div class="detalje">${detalje}</div></div>
        ${pris ? `<div class="pris">${pris}</div>` : ''}
      </label>`;

    html += `<div class="panel"><h2>På tilbud i ${esc(B().navn)}</h2>${
      l.tilbud.length ? l.tilbud.map(v => linje(v.key, tilbudsNavn(v),
        `${v.tilbud.maengde ? esc(v.tilbud.maengde + ' ' + (v.tilbud.enhed || '')) + ' · ' : ''}${v.antal > 1 ? `${kr(v.tilbud.pris)} stk. · ` : ''}Til: ${v.brug.map(esc).join('; ')}`,
        kr(v.pris), v.tilbud.billede)).join('')
      : '<p>Ingen af de valgte retter har tilbudsvarer i denne butik.</p>'}</div>`;

    if (l.oevrige.length) html += `<div class="panel"><h2>Øvrige varer</h2>${
      l.oevrige.map(v => linje(v.key, `${maengde(v.m, v.enhed)} ${v.navn}`.trim(), esc([...new Set(v.retter)].join(', ')))).join('')}</div>`;

    if (l.basis.length) html += `<div class="panel"><h2>Tjek om du har</h2>${
      l.basis.map(([k, navn]) => linje('basis|' + k, navn, '')).join('')}</div>`;
  }
  vis(html);

  bund(`<button class="knap sekundaer" data-kopier>Kopiér liste</button>
       <button class="knap" data-handlet>Jeg har handlet → ugeplan</button>`);
}

function lavPlan() {
  // Retter med frisk fisk o.l. først, resten i valgt rækkefølge
  const orden = [...state.valgte].sort((a, b) => ret(b).spis_tidligt - ret(a).spis_tidligt);
  const idag = new Date();
  state.plan = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(idag); d.setDate(idag.getDate() + i);
    return { dato: d.toISOString().slice(0, 10), ret: orden[i] || null };
  });
}

function renderPlan() {
  vis(state.plan.map((dag, i) => {
    const d = new Date(dag.dato);
    const r = dag.ret && ret(dag.ret);
    const valg = `<select data-dag="${i}">
        <option value="">— Ingen ret —</option>
        ${state.valgte.map(id => `<option value="${id}" ${id === dag.ret ? 'selected' : ''}>${esc(ret(id).navn)}</option>`).join('')}
      </select>`;
    return `
      <details class="dag" ${i === 0 ? 'open' : ''}>
        <summary>
          <div><div class="dagnavn">${DAGE[d.getDay()]} ${d.getDate()}/${d.getMonth() + 1}</div>
               <div class="retnavn">${r ? esc(r.navn) : 'Fri / rester'}</div></div>
          ${valg}
        </summary>
        ${r ? `<div class="opskrift">
          <div><h3>Ingredienser (${state.personer} pers.)</h3><ul>${r.ingredienser.map(ing =>
            `<li>${esc(ingTekst(ing, ing.maengde * faktor()))}</li>`).join('')}</ul></div>
          <div><h3>Fremgangsmåde · ${r.tid_minutter} min</h3><ol>${r.fremgangsmaade.map(t => `<li>${esc(t)}</li>`).join('')}</ol></div>
        </div>` : ''}
      </details>`;
  }).join(''));
  bund(`<button class="knap sekundaer" data-forfra>Start forfra</button><span></span>`);
}

function kopierListe() {
  const l = byggListe();
  const tekst = [
    `Indkøbsliste — ${B().navn}`, '',
    ...l.tilbud.map(v => `☐ ${tilbudsNavn(v)} (${kr(v.pris)})`),
    ...l.oevrige.map(v => `☐ ${maengde(v.m, v.enhed)} ${v.navn}`.replace('  ', ' ')),
    ...(l.basis.length ? ['', 'Tjek om du har:', ...l.basis.map(([, n]) => `☐ ${n}`)] : []),
  ].join('\n');
  navigator.clipboard.writeText(tekst).then(() => alert('Listen er kopieret'));
}

// ---------- Hændelser ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-trin],[data-niveau],[data-filter],[data-ret],[data-gaa],[data-butik],[data-skift],[data-personer],[data-handlet],[data-kopier],[data-forfra]');
  if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.trin) state.trin = d.trin;
  else if (d.niveau) state.niveau = d.niveau;
  else if (d.filter) state.filter = d.filter;
  else if (d.ret) state.valgte = state.valgte.includes(d.ret) ? state.valgte.filter(x => x !== d.ret) : [...state.valgte, d.ret];
  else if (d.gaa) state.trin = d.gaa;
  else if (d.butik) state = { ...TOM, personer: state.personer, butik: d.butik };
  else if ('skift' in d || 'forfra' in d) {
    if ((state.valgte.length || state.handlet) && !confirm('Nulstil valgte retter, indkøbsliste og ugeplan?')) return;
    state = { ...TOM, personer: state.personer };
  }
  else if (d.personer) state.personer = Math.max(1, Math.min(12, state.personer + +d.personer));
  else if ('handlet' in d) { state.handlet = true; lavPlan(); state.trin = 'plan'; }
  else if ('kopier' in d) return kopierListe();
  render();
  if (d.trin || d.gaa || 'handlet' in d) window.scrollTo(0, 0);
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.kryds) { state.afkrydset[t.dataset.kryds] = t.checked; t.closest('.vare').classList.toggle('taget', t.checked); gem(); }
  if (t.dataset.dag) { state.plan[+t.dataset.dag].ret = t.value || null; render(); }
});

start();
</script>
</body>
</html>
