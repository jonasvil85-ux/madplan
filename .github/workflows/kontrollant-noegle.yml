# Prøve af nøglen til kontrollanten (CLAUDE_CODE_OAUTH_TOKEN): ét kort svar fra Claude, ingen kontrol, ingen ændringer.
# Kører, når kontrollant-workflowene ændres på main, og med hånden. Grøn = nøglen virker.
# Oprettet på Jonas' anmodning 2026-11-16 (grundlovsfil).
name: Kontrollant – prøve af nøglen
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kontrollant*.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  proeve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Hemmeligheden findes?
        env:
          T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: if [ -z "$T" ]; then echo "Mangler hemmeligheden CLAUDE_CODE_OAUTH_TOKEN"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code
      - name: Ét kort svar fra Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          svar=$(claude -p 'Svar kun med ordet OK.' --model claude-sonnet-5-5 --max-turns 1 --output-format text)
          echo "Svar: $svar"
          echo "$svar" | grep -q OK || { echo "Nøglen virker ikke som forventet"; exit 1; }
